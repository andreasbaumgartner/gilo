name: Protect Main Branch

on:
  pull_request:
    branches: [main]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR source branch
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::Pull requests to main must come from the dev branch. Got: ${{ github.head_ref }}"
            exit 1
          fi
          echo "PR is from dev branch - allowed."
